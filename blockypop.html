<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BlockyPop — Figurines pop de tous les univers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15121f; --paper:#f7f4fb; --card:#ffffff; --muted:#6a6478;
  --u:#6c5ce7; --radius:16px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#111018; --card:#1b1926; --ink:#f2f0fa; --muted:#a39cc0; }
}
:root[data-theme="dark"]{ --paper:#111018; --card:#1b1926; --ink:#f2f0fa; --muted:#a39cc0; }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;min-height:100%;}
h1,h2,h3,.logo{font-family:'Space Grotesk',sans-serif;}
button{font-family:inherit;cursor:pointer;}
.hard{border:3px solid var(--ink);border-radius:var(--radius);}
.shadow{box-shadow:5px 5px 0 var(--u);}
header{position:sticky;top:0;z-index:50;background:var(--paper);padding:.9rem 1.2rem;padding-top:calc(.9rem + env(safe-area-inset-top,0px));border-bottom:3px solid var(--ink);}
.bar{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:1.4rem;cursor:pointer;user-select:none;}
.logo .pop{background:#ffc93c;color:var(--ink);padding:0 .35rem;border:2px solid var(--ink);border-radius:6px;}
nav.crumbs{font-size:.9rem;color:var(--muted);font-weight:600;}
nav.crumbs a{color:var(--muted);text-decoration:none;cursor:pointer;}
nav.crumbs a:hover{color:var(--ink);}
.cart-btn{background:var(--ink);color:var(--paper);border:none;border-radius:999px;padding:.55rem 1.1rem;font-weight:700;display:flex;gap:.5rem;align-items:center;}
.cart-btn:hover{opacity:.85;}
.cart-count{background:#ffc93c;color:var(--ink);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem;padding:0 4px;}
main{max-width:1180px;margin:0 auto;padding:2.2rem 1.2rem 5rem;}

/* HOME */
.hero{padding:3rem 1.5rem;text-align:center;}
.hero h1{font-size:clamp(1.9rem,5vw,3.1rem);line-height:1.15;margin:0 0 .8rem;}
.hero p{color:var(--muted);max-width:560px;margin:0 auto 1.6rem;font-size:1.08rem;}
.hero .cta{background:var(--ink);color:var(--paper);border:none;border-radius:999px;padding:.85rem 1.6rem;font-weight:700;font-size:1rem;}
.section-label{font-weight:700;color:var(--muted);margin:2.4rem 0 1rem;font-size:.95rem;}
.uni-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
.uni-card{background:var(--card);padding:1.3rem;cursor:pointer;transition:transform .15s;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;}
.uni-card:hover{transform:translate(-2px,-2px);}
.uni-card .em{font-size:2rem;}
.uni-card h3{margin:.4rem 0 .2rem;font-size:1.15rem;}
.uni-card span{color:var(--muted);font-size:.85rem;}

/* UNIVERSE VIEW */
.u-banner{padding:2rem 1.5rem;margin-bottom:2rem;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.u-banner h2{margin:0;font-size:1.8rem;}
.u-banner p{margin:.3rem 0 0;opacity:.9;max-width:480px;}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.1rem;}
.item-card{background:var(--card);cursor:pointer;overflow:hidden;transition:transform .15s;}
.item-card:hover{transform:translate(-2px,-2px);}
.thumb-wrap{aspect-ratio:1/1;display:grid;place-items:center;padding:1rem;}
.item-info{padding:.9rem 1rem 1.1rem;}
.item-info .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;background:#ffc93c;color:var(--ink);margin-bottom:.4rem;}
.item-info h4{margin:.1rem 0 .3rem;font-size:1rem;}
.item-info .price{font-weight:700;}

/* ITEM DETAIL */
.item-detail{display:grid;grid-template-columns:1fr 1fr;gap:2.2rem;}
.viewer{background:var(--card);padding:2rem;display:flex;flex-direction:column;align-items:center;gap:1.3rem;}
.stage{width:100%;max-width:280px;aspect-ratio:1/1;display:grid;place-items:center;perspective:700px;}
.stage svg{width:70%;transition:transform .35s ease;transform-style:preserve-3d;}
.stage img{width:100%;height:100%;object-fit:contain;border-radius:10px;}
.angle-row{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;}
.angle-btn{border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:10px;padding:.5rem .8rem;font-weight:700;font-size:.85rem;}
.angle-btn.active{background:var(--ink);color:var(--paper);}
.detail-info h2{margin:0 0 .3rem;font-size:1.7rem;}
.detail-info .tag{display:inline-block;font-size:.75rem;font-weight:700;padding:.2rem .6rem;border-radius:999px;background:#ffc93c;margin-bottom:.8rem;}
.detail-info p.desc{color:var(--muted);line-height:1.6;margin-bottom:1.2rem;}
.story-box{padding:1rem 1.1rem;margin-bottom:1.2rem;background:var(--paper);}
.story-box strong{display:block;margin-bottom:.4rem;font-size:.85rem;}
.story-box p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.55;}
.detail-info .price{font-size:1.6rem;font-weight:700;margin-bottom:1.2rem;}
.qty-row{display:flex;align-items:center;gap:.8rem;margin-bottom:1.2rem;}
.qty-row button{width:34px;height:34px;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;font-weight:700;font-size:1.1rem;}
.add-btn{background:var(--ink);color:var(--paper);border:none;border-radius:999px;padding:.9rem 1.8rem;font-weight:700;font-size:1rem;width:100%;}
.add-btn:hover{opacity:.85;}

/* CART DRAWER */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;}
.overlay.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:-380px;width:min(380px,92vw);height:100%;background:var(--card);z-index:61;transition:right .3s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.drawer.open{right:0;}
.drawer-head{padding:1.2rem;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center;}
.drawer-head h3{margin:0;}
.drawer-close{background:none;border:none;font-size:1.4rem;color:var(--ink);}
.drawer-items{flex:1;overflow-y:auto;padding:1rem 1.2rem;}
.c-row{display:flex;gap:.8rem;align-items:center;padding:.7rem 0;border-bottom:1px solid #0002;}
.c-row svg{width:40px;flex-shrink:0;}
.c-row .name{font-weight:700;font-size:.9rem;}
.c-row .sub{color:var(--muted);font-size:.8rem;}
.c-row .rm{margin-left:auto;background:none;border:none;color:var(--muted);font-size:1.1rem;}
.drawer-foot{padding:1.2rem;border-top:3px solid var(--ink);}
.drawer-foot .total{display:flex;justify-content:space-between;font-weight:700;font-size:1.15rem;margin-bottom:.9rem;}
.empty-cart{text-align:center;color:var(--muted);padding:2rem 1rem;}

.toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:.7rem 1.3rem;border-radius:999px;font-weight:700;font-size:.9rem;opacity:0;transition:all .3s;z-index:70;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

footer{border-top:3px solid var(--ink);padding:1.5rem;text-align:center;color:var(--muted);font-size:.85rem;}

@media(max-width:760px){
  .item-detail{grid-template-columns:1fr;}
  .uni-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo" onclick="goHome()">Blocky<span class="pop">Pop</span></div>
    <nav class="crumbs" id="crumbs"></nav>
    <button class="cart-btn" onclick="openCart()">🛒 Panier <span class="cart-count" id="cartCount">0</span></button>
  </div>
</header>

<main id="app"></main>

<footer>BlockyPop — figurines pop faites main, tous univers • Prototype de boutique</footer>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><h3>Ton panier</h3><button class="drawer-close" onclick="closeCart()">✕</button></div>
  <div class="drawer-items" id="drawerItems"></div>
  <div class="drawer-foot">
    <div class="total"><span>Total</span><span id="cartTotal">0,00 €</span></div>
    <button class="add-btn" onclick="checkout()">Valider la commande</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
const UNIVERSES=[
 {id:'neon',name:'Néon City',em:'🤖',color:'#6c5ce7',desc:'Robots et héros électriques d\'une mégapole qui ne dort jamais.'},
 {id:'abysses',name:'Abysses',em:'🐙',color:'#12a594',desc:'Créatures phosphorescentes venues du fond des océans.'},
 {id:'ignis',name:'Terra Ignis',em:'🌋',color:'#ff5d3f',desc:'Guerriers de lave et de roche, nés dans le feu.'},
 {id:'frimas',name:'Frimas',em:'❄️',color:'#2f8fe0',desc:'Gardiens de glace d\'un royaume figé dans l\'hiver éternel.'},
 {id:'sylva',name:'Sylva',em:'🌿',color:'#3cb371',desc:'Esprits de la forêt magique, mousse et écorce vivante.'},
 {id:'cosmos',name:'Cosmos',em:'🪐',color:'#d6409f',desc:'Explorateurs stellaires perdus entre deux galaxies.'},
 {id:'blockland',name:'Blockland',em:'⛏️',color:'#5cb85c',desc:'Le monde cubique d\'où tout est parti : terre battue, blocs empilés et aventure à ciel ouvert.'}
];
const NAMES={
 neon:[['Pixel Byte','Prototype'],['Volt Ranger','Édition limitée'],['Chrome Fang','Rare'],['Glitch Sentinel','Commun']],
 abysses:[['Larve Lumineuse','Commun'],['Kraken Miniature','Rare'],['Perle Noire','Édition limitée'],['Nageur des Failles','Prototype']],
 ignis:[['Braise Vive','Commun'],['Golem de Cendre','Rare'],['Cœur de Magma','Édition limitée'],['Sentinelle Ardente','Prototype']],
 frimas:[['Flocon Gardien','Commun'],['Cristal Sombre','Rare'],['Ours de Givre','Édition limitée'],['Sculpteur de Gel','Prototype']],
 sylva:[['Bourgeon Farceur','Commun'],['Vieux Chêne','Rare'],['Luciole des Bois','Édition limitée'],['Racine Errante','Prototype']],
 cosmos:[['Cadet Stellaire','Commun'],['Éclaireur Comète','Rare'],['Gardien d\'Orbite','Édition limitée'],['Voyageur Vide','Prototype']],
 blockland:[['Cube Miner','Icône'],['Brique Forestière','Commun'],['Bâtisseur de Nuit','Rare'],['Golem de Terre','Édition limitée']]
};
const TAG_COLOR={Commun:'#e5e1f2',Rare:'#ffc93c',['Édition limitée']:'#ff8fb1',Prototype:'#8fe0ff',['Icône']:'#ffd54f'};
const PRICE={Commun:9.99,Rare:12.99,['Édition limitée']:16.99,Prototype:14.99,['Icône']:11.99};
const STORY={
 'blockland-0':"Cube Miner, c'est la toute première figurine sortie de l'atelier BlockyPop : chemise bleu ciel, salopette terre battue, et cette allure carrée qui a lancé toute la collection Blockland. Un clin d'œil assumé aux héros cubiques qu'on adore, réinventé avec notre propre style — aucune licence, juste notre mascotte maison."
};
// Chemin des photos par item et par angle. Dépose tes fichiers dans ce dossier,
// à côté de ce fichier HTML, en respectant exactement ces noms :
// assets/items/<id-de-l-item>/front.jpg | right.jpg | left.jpg | back.jpg
// Un item sans entrée ici retombe automatiquement sur le visuel SVG généré.
const IMAGES={
 'blockland-0':{
   front:'assets/items/cube-miner/front.jpg',
   right:'assets/items/cube-miner/right.jpg',
   left:'assets/items/cube-miner/left.jpg',
   back:'assets/items/cube-miner/back.jpg'
 }
};

let ITEMS=[];
UNIVERSES.forEach(u=>{
  NAMES[u.id].forEach((n,i)=>{
    ITEMS.push({id:u.id+'-'+i,uni:u.id,name:n[0],tag:n[1],price:PRICE[n[1]],color:u.color});
  });
});

let cart=[]; // {id, qty}
let view={type:'home'};

function accentShade(hex){ return hex; }

function figureSVG(color,idKey){
  return `<svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
    <rect x="28" y="6" width="44" height="38" rx="4" fill="${color}" stroke="#15121f" stroke-width="3"/>
    <g class="face-${idKey}">
      <rect x="37" y="20" width="9" height="10" fill="#15121f"/>
      <rect x="54" y="20" width="9" height="10" fill="#15121f"/>
      <rect x="42" y="33" width="16" height="5" fill="#15121f" opacity=".55"/>
    </g>
    <rect x="22" y="46" width="56" height="42" rx="5" fill="${color}" stroke="#15121f" stroke-width="3"/>
    <rect x="10" y="48" width="14" height="34" rx="4" fill="${color}" stroke="#15121f" stroke-width="3"/>
    <rect x="76" y="48" width="14" height="34" rx="4" fill="${color}" stroke="#15121f" stroke-width="3"/>
    <rect x="28" y="90" width="18" height="34" rx="4" fill="${color}" stroke="#15121f" stroke-width="3"/>
    <rect x="54" y="90" width="18" height="34" rx="4" fill="${color}" stroke="#15121f" stroke-width="3"/>
  </svg>`;
}

function setAngle(el,angle,itemId){
  const img=el.querySelector('img');
  if(img && IMAGES[itemId]){
    img.src=IMAGES[itemId][angle];
    img.alt=itemId+' — '+angle;
    return;
  }
  const svg=el.querySelector('svg');
  if(!svg) return;
  const face=svg.querySelector('[class^="face-"]');
  let t='rotateY(0deg)';
  if(angle==='right') t='rotateY(38deg)';
  if(angle==='left') t='rotateY(-38deg)';
  if(angle==='back') t='rotateY(180deg)';
  svg.style.transform=t;
  face.style.opacity = angle==='back' ? 0 : (angle==='front' ? 1 : .55);
}

function money(n){ return n.toFixed(2).replace('.',',')+' €'; }

function goHome(){ view={type:'home'}; render(); }
function goUniverse(id){ view={type:'uni',id}; render(); window.scrollTo(0,0); }
function goItem(id){ view={type:'item',id}; render(); window.scrollTo(0,0); }

function render(){
  const app=document.getElementById('app');
  const crumbs=document.getElementById('crumbs');
  if(view.type==='home'){
    crumbs.innerHTML='';
    app.innerHTML=`
      <section class="hero">
        <h1>Des figurines pop pour<br>tous les univers.</h1>
        <p>Choisis un univers, découvre ses habitants en pixels, fais tourner la figurine sous tous les angles, puis ajoute-la à ton panier.</p>
        <button class="cta" onclick="document.getElementById('uniGrid').scrollIntoView({behavior:'smooth'})">Explorer les univers</button>
      </section>
      <div class="section-label">Univers disponibles</div>
      <div class="uni-grid" id="uniGrid"></div>`;
    const grid=document.getElementById('uniGrid');
    UNIVERSES.forEach(u=>{
      const c=document.createElement('div');
      c.className='uni-card hard shadow';
      c.style.setProperty('--u',u.color);
      c.onclick=()=>goUniverse(u.id);
      c.innerHTML=`<div class="em">${u.em}</div><div><h3>${u.name}</h3><span>${u.desc}</span></div>`;
      grid.appendChild(c);
    });
  }
  else if(view.type==='uni'){
    const u=UNIVERSES.find(x=>x.id===view.id);
    crumbs.innerHTML=`<a onclick="goHome()">Univers</a> / ${u.name}`;
    app.innerHTML=`
      <div class="u-banner hard" style="background:${u.color};border-color:${u.color};">
        <div><h2>${u.em} ${u.name}</h2><p>${u.desc}</p></div>
      </div>
      <div class="item-grid" id="itemGrid"></div>`;
    const grid=document.getElementById('itemGrid');
    ITEMS.filter(it=>it.uni===u.id).forEach(it=>{
      const c=document.createElement('div');
      c.className='item-card hard';
      c.style.setProperty('--u',u.color);
      c.classList.add('shadow');
      c.onclick=()=>goItem(it.id);
      c.innerHTML=`<div class="thumb-wrap">${figureSVG(it.color,it.id+'-t')}</div>
        <div class="item-info">
          <span class="tag" style="background:${TAG_COLOR[it.tag]}">${it.tag}</span>
          <h4>${it.name}</h4>
          <div class="price">${money(it.price)}</div>
        </div>`;
      grid.appendChild(c);
    });
  }
  else if(view.type==='item'){
    const it=ITEMS.find(x=>x.id===view.id);
    const u=UNIVERSES.find(x=>x.id===it.uni);
    crumbs.innerHTML=`<a onclick="goHome()">Univers</a> / <a onclick="goUniverse('${u.id}')">${u.name}</a> / ${it.name}`;
    app.innerHTML=`
      <div class="item-detail">
        <div class="viewer hard shadow" style="--u:${u.color}">
          <div class="stage" id="stage">${IMAGES[it.id] ? `<img src="${IMAGES[it.id].front}" alt="${it.name} — face" onerror="this.replaceWith(document.createRange().createContextualFragment('${figureSVG(it.color,it.id+'-d').replace(/'/g,"\\'")}'))">` : figureSVG(it.color,it.id+'-d')}</div>
          <div class="angle-row" id="angleRow"></div>
        </div>
        <div class="detail-info">
          <span class="tag" style="background:${TAG_COLOR[it.tag]}">${it.tag} · ${u.name}</span>
          <h2>${it.name}</h2>
          <p class="desc">Figurine collector de l'univers ${u.name}, sculptée façon blocky-pop avec finition mate et détails peints à la main. Regarde-la sous ses 4 angles avant de l'ajouter à ta collection.</p>
          ${STORY[it.id] ? `<div class="story-box hard"><strong>Le mot de l'atelier</strong><p>${STORY[it.id]}</p></div>` : ''}
          <div class="price">${money(it.price)}</div>
          <div class="qty-row">
            <button onclick="changeQty(-1)">−</button>
            <span id="qtyVal">1</span>
            <button onclick="changeQty(1)">+</button>
          </div>
          <button class="add-btn" onclick="addToCart('${it.id}')">Ajouter au panier</button>
        </div>
      </div>`;
    const angles=[['front','👀 Face'],['right','➡️ Droite'],['left','⬅️ Gauche'],['back','🔄 Dos']];
    const row=document.getElementById('angleRow');
    angles.forEach((a,i)=>{
      const b=document.createElement('button');
      b.className='angle-btn'+(i===0?' active':'');
      b.textContent=a[1];
      b.onclick=()=>{
        row.querySelectorAll('.angle-btn').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        setAngle(document.getElementById('stage'),a[0],it.id);
      };
      row.appendChild(b);
    });
    setAngle(document.getElementById('stage'),'front',it.id);
    curQty=1;
  }
  renderCart();
}

let curQty=1;
function changeQty(d){
  curQty=Math.max(1,curQty+d);
  document.getElementById('qtyVal').textContent=curQty;
}

function addToCart(id){
  const found=cart.find(c=>c.id===id);
  if(found) found.qty+=curQty; else cart.push({id,qty:curQty});
  renderCart();
  showToast('⛏️ Ajouté au panier !');
  openCart();
}
function removeFromCart(id){
  cart=cart.filter(c=>c.id!==id);
  renderCart();
}
function renderCart(){
  const totalQty=cart.reduce((s,c)=>s+c.qty,0);
  document.getElementById('cartCount').textContent=totalQty;
  const wrap=document.getElementById('drawerItems');
  if(cart.length===0){
    wrap.innerHTML='<div class="empty-cart">Ton panier est vide pour l\'instant.</div>';
  } else {
    wrap.innerHTML='';
    let total=0;
    cart.forEach(c=>{
      const it=ITEMS.find(x=>x.id===c.id);
      total+=it.price*c.qty;
      const row=document.createElement('div');
      row.className='c-row';
      row.innerHTML=`${figureSVG(it.color,c.id+'-c')}
        <div><div class="name">${it.name}</div><div class="sub">×${c.qty} — ${money(it.price*c.qty)}</div></div>
        <button class="rm" onclick="removeFromCart('${c.id}')">✕</button>`;
      wrap.appendChild(row);
    });
    document.getElementById('cartTotal').textContent=money(total);
  }
  if(cart.length===0) document.getElementById('cartTotal').textContent=money(0);
}
function openCart(){ document.getElementById('drawer').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closeCart(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }
function checkout(){
  if(cart.length===0){ showToast('Panier vide !'); return; }
  showToast('✅ Commande simulée — merci !');
  cart=[]; renderCart(); closeCart();
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

render();
</script>
</body>
</html>
